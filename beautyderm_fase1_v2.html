    const SEMANA_LABELS = ["Semana 1", "Semana 2", "Semana 3", "Semana 4"];

    function App() {
      const [mainTab, setMainTab] = useState("diagnostico");
      const [activeArea, setActiveArea] = useState("ops");
      const [activeSemana, setActiveSemana] = useState(0);
      const [checked, setChecked] = useState({});
      const [activePropuesta, setActivePropuesta] = useState("rrhh");
      const [expandedItems, setExpandedItems] = useState({});
      const [activeComunicacion, setActiveComunicacion] = useState("apertura");

      const area = data.areas.find((a) => a.id === activeArea);
      const semanaData = area.semanas[activeSemana];
      const semanaKey = `${activeArea}-${activeSemana}`;

      const toggleCheck = (idx) => {
        const key = `${semanaKey}-${idx}`;
        setChecked((prev) => ({ ...prev, [key]: !prev[key] }));
      };

      const toggleExpand = (key) => {
        setExpandedItems((prev) => ({ ...prev, [key]: !prev[key] }));
      };

      const getProgress = (areaId, semanaIdx) => {
        const a = data.areas.find((x) => x.id === areaId);
        const items = a.semanas[semanaIdx].items;
        const done = items.filter((_, i) => checked[`${areaId}-${semanaIdx}-${i}`]).length;
        return Math.round((done / items.length) * 100);
      };

      const totalItems = data.areas.flatMap((a) =>
        a.semanas.flatMap((s, si) => s.items.map((_, ii) => `${a.id}-${si}-${ii}`))
      ).length;
      const totalDone = Object.values(checked).filter(Boolean).length;
      const globalProgress = Math.round((totalDone / totalItems) * 100);
      const propuestaActiva = propuestas.find((p) => p.id === activePropuesta);
      const com = comunicaciones.find(c => c.id === activeComunicacion);

      return (
        <div style={{ minHeight: "100vh", background: T.bg, color: T.text, fontFamily: "'Georgia', 'Times New Roman', serif", display: "flex", flexDirection: "column" }}>

          {/* ── Header ─────────────────────────────────────── */}
          <div style={{ background: T.surface, borderBottom: `1px solid ${T.border}`, padding: "36px 48px 28px", display: "flex", alignItems: "flex-end", justifyContent: "space-between", flexWrap: "wrap", gap: 20 }}>
            <div>
              <div style={{ fontSize: 10, letterSpacing: 5, color: T.muted, marginBottom: 10, fontFamily: "monospace", fontWeight: "normal" }}>FASE 1 · DIAGNÓSTICO</div>
              <div style={{ fontSize: 32, fontWeight: "normal", letterSpacing: 1, color: T.text }}>{data.meta.title}</div>
              <div style={{ fontSize: 13, color: T.text2, marginTop: 5, letterSpacing: 0.5, fontStyle: "italic" }}>{data.meta.subtitle}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 10, color: T.muted, letterSpacing: 3, marginBottom: 8, fontFamily: "monospace" }}>PROGRESO GLOBAL</div>
              <div style={{ fontSize: 40, color: area.color, fontWeight: "normal", lineHeight: 1 }}>
                {globalProgress}<span style={{ fontSize: 16, color: T.muted, marginLeft: 2 }}>%</span>
              </div>
              <div style={{ width: 160, height: 3, background: T.border, marginTop: 10, borderRadius: 3, marginLeft: "auto" }}>
                <div style={{ width: `${globalProgress}%`, height: "100%", background: area.color, borderRadius: 3, transition: "width 0.5s ease" }} />
              </div>
              <div style={{ fontSize: 10, color: T.muted, marginTop: 6, fontFamily: "monospace", letterSpacing: 1 }}>{totalDone} de {totalItems} ítems</div>
            </div>
          </div>

          {/* ── Tabs principales ────────────────────────────── */}
          <div style={{ background: T.surface, display: "flex", borderBottom: `1px solid ${T.border}`, padding: "0 48px" }}>

              <button key={tab.id} onClick={() => setMainTab(tab.id)} style={{
                background: "none", border: "none",
                borderBottom: mainTab === tab.id ? `2px solid ${T.text}` : "2px solid transparent",
                color: mainTab === tab.id ? T.text : T.muted,
                padding: "14px 0", marginRight: 32, cursor: "pointer",
                fontSize: 10, letterSpacing: 4, fontFamily: "monospace",
                transition: "all 0.2s"
              }}>
                {tab.label}
              </button>
            ))}
          </div>

          {/* ══════════════════════════════════════════════════
              TAB: DIAGNÓSTICO
          ══════════════════════════════════════════════════ */}
          {mainTab === "diagnostico" && (
            <>
              {/* Areas */}
              <div style={{ background: T.surface, display: "flex", gap: 0, borderBottom: `1px solid ${T.border}`, overflowX: "auto" }}>

                      background: isActive ? a.light : "none",

                      borderBottom: isActive ? `2px solid ${a.color}` : "2px solid transparent",
                      borderTop: isActive ? `2px solid ${a.border}` : "2px solid transparent",
                      color: isActive ? a.color : T.muted,
                      padding: "14px 24px", cursor: "pointer",
                      fontSize: 10, letterSpacing: 2, fontFamily: "monospace",
                      whiteSpace: "nowrap", transition: "all 0.2s",
                      display: "flex", alignItems: "center", gap: 8

                      {a.label}

                        fontSize: 9, marginLeft: 2,

                        background: isActive ? a.border : T.surface2,
                        padding: "2px 6px", borderRadius: 20, fontWeight: "bold"
                      }}>{totalProg}%</span>
                    </button>

              </div>

              <div style={{ background: T.surface2, display: "flex", gap: 0, padding: "0 48px", borderBottom: `1px solid ${T.border}`, overflowX: "auto" }}>
                {SEMANA_LABELS.map((label, idx) => {
                  const prog = getProgress(activeArea, idx);
                  const isActive = activeSemana === idx;
                  return (
                    <button key={idx} onClick={() => setActiveSemana(idx)} style={{
                      background: "none", border: "none",
                      borderBottom: isActive ? `2px solid ${area.color}` : "2px solid transparent",
                      color: isActive ? T.text : T.text2,
                      padding: "12px 20px", cursor: "pointer",
                      fontSize: 12, letterSpacing: 1,
                      transition: "all 0.2s",
                      display: "flex", flexDirection: "column", alignItems: "center", gap: 6
                    }}>
                      {label}
                      <div style={{ width: 44, height: 3, background: T.border, borderRadius: 3 }}>
                        <div style={{ width: `${prog}%`, height: "100%", background: area.color, borderRadius: 3, transition: "width 0.4s ease", opacity: 0.8 }} />
                      </div>
                    </button>
                  );
                })}
              </div>

              {/* Contenido semana */}

                {/* Foco */}

                  </div>
                </div>

                {/* Items */}
                <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
                  {semanaData.items.map((item, idx) => {
                    const key = `${semanaKey}-${idx}`;
                    const isDone = checked[key];
                    return (
                      <div key={idx} onClick={() => toggleCheck(idx)} style={{
                        display: "flex", alignItems: "flex-start", gap: 16,
                        padding: "16px 12px",
                        borderBottom: `1px solid ${T.border}`,
                        cursor: "pointer",
                        transition: "all 0.15s",
                        opacity: isDone ? 0.45 : 1,
                        borderRadius: 4,
                        background: isDone ? T.surface2 : "transparent",
                      }}>
                        <div style={{
                          width: 20, height: 20,
                          border: `1.5px solid ${isDone ? area.color : T.border}`,
                          borderRadius: 4,
                          display: "flex", alignItems: "center", justifyContent: "center",
                          flexShrink: 0, marginTop: 2,
                          background: isDone ? area.color : T.surface,
                          transition: "all 0.15s"
                        }}>
                          {isDone && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>}
                        </div>
                        <div style={{
                          fontSize: 15, lineHeight: 1.65,
                          color: isDone ? T.muted : T.text,
                          textDecoration: isDone ? "line-through" : "none",
                          transition: "all 0.15s"
                        }}>{item}</div>
                      </div>
                    );
                  })}
                </div>

                {/* Progress bar */}
                <div style={{ marginTop: 36, padding: "16px 20px", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 6 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8, fontSize: 10, letterSpacing: 2, color: T.muted, fontFamily: "monospace" }}>
                    <span>{SEMANA_LABELS[activeSemana].toUpperCase()} · {area.label}</span>
                    <span style={{ color: area.color, fontWeight: "bold" }}>{getProgress(activeArea, activeSemana)}%</span>
                  </div>
                  <div style={{ height: 4, background: T.border, borderRadius: 4 }}>
                    <div style={{ width: `${getProgress(activeArea, activeSemana)}%`, height: "100%", background: area.color, borderRadius: 4, transition: "width 0.4s ease" }} />
                  </div>
                </div>
              </div>
            </>
          )}

          {/* ══════════════════════════════════════════════════
              TAB: PROPUESTAS
          ══════════════════════════════════════════════════ */}
          {mainTab === "propuestas" && (
            <>
              <div style={{ background: T.surface, display: "flex", gap: 0, borderBottom: `1px solid ${T.border}`, overflowX: "auto" }}>
                {propuestas.map((p) => {
                  const isActive = activePropuesta === p.id;
                  return (
                    <button key={p.id} onClick={() => setActivePropuesta(p.id)} style={{
                      background: isActive ? p.light : "none",
                      border: "none",
                      borderBottom: isActive ? `2px solid ${p.color}` : "2px solid transparent",
                      color: isActive ? p.color : T.muted,
                      padding: "16px 28px", cursor: "pointer",
                      fontSize: 10, letterSpacing: 3, fontFamily: "monospace",
                      whiteSpace: "nowrap", transition: "all 0.2s",
                      display: "flex", alignItems: "center", gap: 8
                    }}>
                      <span style={{ fontSize: 15 }}>{p.icon}</span>{p.label}
                    </button>
                  );
                })}
              </div>

              <div style={{ flex: 1, padding: "44px 48px", maxWidth: 980 }}>
                {/* Intro */}
                <div style={{ marginBottom: 40, padding: "28px 32px", background: propuestaActiva.light, border: `1px solid ${propuestaActiva.border}`, borderRadius: 8, borderLeft: `4px solid ${propuestaActiva.color}` }}>
                  <div style={{ fontSize: 9, letterSpacing: 4, color: propuestaActiva.color, fontFamily: "monospace", marginBottom: 10 }}>DECLARACIÓN DE ÁREA</div>
                  <div style={{ fontSize: 19, color: T.text, marginBottom: 14, fontWeight: "normal", lineHeight: 1.4 }}>{propuestaActiva.intro.titulo}</div>
                  <div style={{ fontSize: 14, color: T.text2, lineHeight: 1.9, maxWidth: 740 }}>{propuestaActiva.intro.texto}</div>
                </div>

                {/* Evaluadores */}
                {propuestaActiva.evaluadores && (
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 32, marginBottom: 40, padding: "18px 24px", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8 }}>
                    <div style={{ fontSize: 9, letterSpacing: 3, color: T.muted, fontFamily: "monospace", whiteSpace: "nowrap", paddingTop: 2 }}>AUTORIDADES<br />DE EVALUACIÓN</div>
                    <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
                      {propuestaActiva.evaluadores.map((ev, i) => (
                        <div key={i} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                          <div style={{ fontSize: 14, color: propuestaActiva.color, letterSpacing: 0.5 }}>{ev.nombre}</div>
                          <div style={{ fontSize: 9, color: T.muted, fontFamily: "monospace", letterSpacing: 2 }}>{ev.rol.toUpperCase()}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{ marginLeft: "auto", fontSize: 11, color: T.text2, lineHeight: 1.7, maxWidth: 280, textAlign: "right", fontStyle: "italic" }}>
                      Pueden señalar un incumplimiento en cualquier momento, siempre indicando la norma específica.
                    </div>
                  </div>
                )}

                {/* Secciones */}
                {propuestaActiva.secciones.map((seccion, si) => (
                  <div key={si} style={{ marginBottom: 36 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 8, paddingBottom: 10, borderBottom: `1px solid ${T.border}` }}>
                      <div style={{ fontSize: 11, letterSpacing: 2, color: T.text, fontFamily: "monospace", flex: 1 }}>{seccion.titulo.toUpperCase()}</div>
                      <div style={{
                        fontSize: 9, letterSpacing: 1,
                        color: seccion.estado === "APROBADO" ? "#3D826A" : seccion.estado === "EN REVISIÓN" ? "#B8763A" : T.muted,
                        fontFamily: "monospace",
                        border: `1px solid currentColor`,
                        padding: "2px 8px", borderRadius: 20, opacity: 0.8
                      }}>{seccion.estado}</div>
                    </div>

                    {seccion.items.map((item, ii) => {
                      const expandKey = `${propuestaActiva.id}-${si}-${ii}`;
                      const isExpanded = expandedItems[expandKey];
                      return (
                        <div key={ii} style={{ borderBottom: `1px solid ${T.border}`, overflow: "hidden" }}>
                          <div onClick={() => toggleExpand(expandKey)} style={{
                            display: "flex", alignItems: "flex-start", gap: 14,
                            padding: "14px 8px", cursor: "pointer",
                            transition: "background 0.15s",
                            background: isExpanded ? propuestaActiva.light : "transparent",
                            borderRadius: isExpanded ? "6px 6px 0 0" : 0,
                          }}>
                            <div style={{ width: 7, height: 7, borderRadius: "50%", background: propuestaActiva.color, flexShrink: 0, marginTop: 7, opacity: 0.7 }} />
                            <div style={{ flex: 1, fontSize: 14, color: T.text, lineHeight: 1.55 }}>{item.label}</div>
                            <div style={{
                              fontSize: 18, color: propuestaActiva.color,
                              transform: isExpanded ? "rotate(90deg)" : "rotate(0deg)",
                              transition: "transform 0.2s", flexShrink: 0, marginTop: -1, opacity: 0.6
                            }}>›</div>
                          </div>
                          {isExpanded && (
                            <div style={{
                              padding: "4px 20px 20px 30px",
                              fontSize: 13, color: T.text2, lineHeight: 1.85,
                              maxWidth: 700,
                              background: propuestaActiva.light,
                              borderLeft: `3px solid ${propuestaActiva.border}`,
                              borderRadius: "0 0 6px 0",
                              marginLeft: 3,
                            }}>
                              {item.detalle}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                ))}

                <div style={{ marginTop: 48, padding: "14px 20px", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 6, fontSize: 10, color: T.muted, letterSpacing: 1, fontFamily: "monospace", lineHeight: 1.8 }}>
                  ESTADO: BORRADOR · Pendiente de revisión y aprobación por dirección · Beautyderm Fase 1
                </div>
              </div>
            </>
          )}

          {/* ══════════════════════════════════════════════════
              TAB: COMUNICACIONES / BAJADAS
          ══════════════════════════════════════════════════ */}
          {mainTab === "comunicaciones" && (
            <>
              <div style={{ background: T.surface, display: "flex", gap: 0, borderBottom: `1px solid ${T.border}`, overflowX: "auto" }}>
                {comunicaciones.map((c) => {
                  const isActive = activeComunicacion === c.id;
                  return (
                    <button key={c.id} onClick={() => setActiveComunicacion(c.id)} style={{
                      background: isActive ? c.light : "none",
                      border: "none",
                      borderBottom: isActive ? `2px solid ${c.color}` : "2px solid transparent",
                      color: isActive ? c.color : T.muted,
                      padding: "14px 24px", cursor: "pointer",
                      fontSize: 10, letterSpacing: 2, fontFamily: "monospace",
                      whiteSpace: "nowrap", transition: "all 0.2s",
                      display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 4
                    }}>
                      {c.label}
                      <span style={{ fontSize: 9, color: isActive ? c.color : T.border, letterSpacing: 1, opacity: 0.8 }}>
                        {c.subtitulo.split("·")[0].trim()}
                      </span>
                    </button>
                  );
                })}
              </div>

                {/* Header comunicación */}
                <div style={{ marginBottom: 32 }}>
                  <div style={{ fontSize: 9, letterSpacing: 4, color: T.muted, fontFamily: "monospace", marginBottom: 8 }}>{com.subtitulo.toUpperCase()}</div>
                  <div style={{ fontSize: 24, color: T.text, fontWeight: "normal", lineHeight: 1.3, marginBottom: 14 }}>{com.label}</div>
                  <div style={{ fontSize: 11, fontFamily: "monospace", color: T.text2 }}>
                    TONO · <span style={{ color: com.color }}>{com.tono}</span>
                  </div>
                </div>

                {/* Contexto */}
                <div style={{ padding: "16px 20px", background: com.light, border: `1px solid ${com.border}`, borderRadius: 6, marginBottom: 32 }}>

                  <div style={{ fontSize: 13, color: T.text2, lineHeight: 1.75 }}>{com.contexto}</div>

                {/* Texto */}
                <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: "32px 36px", marginBottom: 24, borderLeft: `4px solid ${com.color}` }}>
                  <div style={{ fontSize: 9, letterSpacing: 4, color: com.color, fontFamily: "monospace", marginBottom: 20 }}>TEXTO</div>
                  {com.texto.split("\n\n").map((parrafo, i) => (
                    <p key={i} style={{
                      fontSize: 15,
                      color: parrafo.startsWith("[") ? T.muted : T.text,
                      lineHeight: 1.95,
                      marginBottom: 20,
                      fontStyle: parrafo.startsWith("[") ? "italic" : "normal"
                    }}>{parrafo}</p>
                  ))}
                </div>

                {/* Notas */}
                <div style={{ padding: "16px 20px", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 6 }}>
                  <span style={{ fontSize: 9, letterSpacing: 3, color: T.muted, fontFamily: "monospace", display: "block", marginBottom: 6 }}>NOTAS</span>
                  <div style={{ fontSize: 12, color: T.text2, lineHeight: 1.75, fontStyle: "italic" }}>{com.notas}</div>
                </div>
              </div>
            </>
          )}

          {/* ── Footer ─────────────────────────────────────── */}
          <div style={{ padding: "18px 48px", borderTop: `1px solid ${T.border}`, background: T.surface, display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 9, color: T.muted, letterSpacing: 3, fontFamily: "monospace" }}>
            <span>BEAUTYDERM · CENTRO MÉDICO ESTÉTICO</span>
            <span>FASE 1 · {data.areas.length} ÁREAS · 4 SEMANAS</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
